<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 100" width="100%" height="100%">
  <!-- Aditya Utsav Premium Logo -->
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F3E5AB" />
      <stop offset="50%" stop-color="#D4AF37" />
      <stop offset="100%" stop-color="#AA771C" />
    </linearGradient>
    <linearGradient id="burgundyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#800033" />
      <stop offset="100%" stop-color="#550020" />
    </linearGradient>
  </defs>

  <!-- Left Traditional Kalash / Diya / Lotus Motif -->
  <g transform="translate(10, 15)">
    <!-- Kalash Base / Pot -->
    <path d="M 35 48 C 30 65, 45 72, 50 72 C 55 72, 70 65, 65 48 Z" fill="url(#burgundyGrad)" stroke="url(#goldGrad)" stroke-width="2" />
    <path d="M 30 48 Q 50 42 70 48" stroke="url(#goldGrad)" stroke-width="2.5" fill="none" stroke-linecap="round" />
    <!-- Mango leaves -->
    <path d="M 50 44 C 36 34, 30 22, 28 15 C 36 17, 46 26, 49 42" fill="url(#goldGrad)" opacity="0.9" />
    <path d="M 50 44 C 64 34, 70 22, 72 15 C 64 17, 54 26, 51 42" fill="url(#goldGrad)" opacity="0.9" />
    <path d="M 50 42 C 43 28, 47 12, 50 6 C 53 12, 57 28, 50 42" fill="url(#goldGrad)" />
    <!-- Coconut top & Auspicious dot -->
    <circle cx="50" cy="24" r="5" fill="#800033" stroke="url(#goldGrad)" stroke-width="1.5" />
    <circle cx="50" cy="58" r="3" fill="url(#goldGrad)" />
  </g>

  <!-- Brand Typography -->
  <!-- "ADITYA" -->
  <text x="95" y="48" font-family="'Playfair Display', Georgia, 'Times New Roman', serif" font-size="34" font-weight="700" letter-spacing="3" fill="#72002F">ADITYA</text>
  <!-- "UTSAV" -->
  <text x="250" y="48" font-family="'Playfair Display', Georgia, 'Times New Roman', serif" font-size="34" font-weight="600" letter-spacing="3" fill="#D4AF37">UTSAV</text>

  <!-- Tagline / Subtitle -->
  <text x="96" y="70" font-family="'Inter', -apple-system, BlinkMacSystemFont, sans-serif" font-size="10.5" font-weight="600" letter-spacing="4.5" fill="#6B5E57">BIHAR WEDDING &amp; EVENT DECOR</text>

  <!-- Decorative underline divider with small central diamond -->
  <line x1="95" y1="54" x2="225" y2="54" stroke="#D4AF37" stroke-width="1" stroke-opacity="0.6" />
  <polygon points="230,54 233,51 236,54 233,57" fill="#D4AF37" />
  <line x1="241" y1="54" x2="385" y2="54" stroke="#D4AF37" stroke-width="1" stroke-opacity="0.6" />
</svg>
