<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#72002F" />
      <stop offset="50%" stop-color="#550020" />
      <stop offset="100%" stop-color="#1F1F1F" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F6E6B4" />
      <stop offset="50%" stop-color="#D4AF37" />
      <stop offset="100%" stop-color="#AA771C" />
    </linearGradient>
  </defs>
  <rect width="800" height="600" fill="url(#bgGrad)" />
  <!-- Traditional Border Pattern -->
  <rect x="20" y="20" width="760" height="560" fill="none" stroke="url(#goldGrad)" stroke-width="2" stroke-dasharray="10,5" opacity="0.6" />
  <rect x="30" y="30" width="740" height="540" fill="none" stroke="url(#goldGrad)" stroke-width="1" opacity="0.4" />
  
  <!-- Center Motif -->
  <g transform="translate(350, 200)">
    <circle cx="50" cy="50" r="45" fill="none" stroke="url(#goldGrad)" stroke-width="2" />
    <path d="M 50 20 Q 65 35 50 50 Q 35 35 50 20 Z" fill="url(#goldGrad)" opacity="0.9" />
    <path d="M 20 50 Q 35 65 50 50 Q 35 35 20 50 Z" fill="url(#goldGrad)" opacity="0.9" />
    <path d="M 50 80 Q 65 65 50 50 Q 35 65 50 80 Z" fill="url(#goldGrad)" opacity="0.9" />
    <path d="M 80 50 Q 65 65 50 50 Q 65 35 80 50 Z" fill="url(#goldGrad)" opacity="0.9" />
    <circle cx="50" cy="50" r="6" fill="#D4AF37" />
  </g>
  
  <!-- Text -->
  <text x="400" y="360" font-family="'Playfair Display', Georgia, serif" font-size="28" font-weight="700" letter-spacing="3" fill="#FFF8F0" text-anchor="middle">ADITYA UTSAV</text>
  <text x="400" y="395" font-family="'DM Sans', sans-serif" font-size="14" font-weight="500" letter-spacing="4" fill="#D4AF37" text-anchor="middle">BIHAR WEDDING DECORATION</text>
  <text x="400" y="430" font-family="'DM Sans', sans-serif" font-size="12" fill="#EADBCE" opacity="0.8" text-anchor="middle">Photo Preview Coming Soon</text>
</svg>
